name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (CI)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          echo "No tests configured yet"
          # pytest   # enable this when you add tests

      # ---------- Prepare SSH key from GitHub secret ----------
      - name: Prepare SSH key for EC2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ams-devops-key.pem
          chmod 600 ~/.ssh/ams-devops-key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # ---------- Deploy to your EC2 server ----------
      - name: Deploy to EC2
        run: |
          echo "Deploying to EC2 ${{ secrets.EC2_HOST }}..."
          ssh -i ~/.ssh/ams-devops-key.pem ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            # If project folder does not exist, clone it
            if [ ! -d "/home/ubuntu/AirlineManagementSystem" ]; then
              cd /home/ubuntu
              git clone https://github.com/vishalsrs990-max/AirlineManagementSystem.git
            fi

            cd /home/ubuntu/AirlineManagementSystem

            # Pull latest code
            git pull

            # Create / activate virtualenv
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate

            # Install dependencies
            if [ -f requirements.txt ]; then
              pip install --upgrade pip
              pip install -r requirements.txt
            fi

            # Stop any existing Flask app
            pkill -f "python app.py" || true

            # Start app in background
            nohup python app.py > app.log 2>&1 &
          EOF
