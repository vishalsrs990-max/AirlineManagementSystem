<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add a New Flight</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="page">

<header class="top-bar">
    <div class="top-bar-left">
        <div class="logo-circle">AMS</div>
        <div class="brand-text">
            <span class="brand-name">Airline Management System</span>
            <span class="brand-subtitle">Flight information &amp; management</span>
        </div>
    </div>

    <nav class="top-nav">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('add_mongo') }}">Admin</a>
    </nav>
</header>

<main class="form-page">

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="flash-messages">
        {% for message in messages %}
        <div class="flash-message">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <section class="form-card">
        <h1>Add a new flight</h1>

        <form method="POST" action="{{ url_for('add_mongo') }}">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="flightID">Flight ID</label>
                    <input class="form-input" type="text" id="flightID" name="flightID" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="origin">Origin</label>
                    <input class="form-input" type="text" id="origin" name="origin" placeholder="Dublin, Ireland" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="destination">Destination</label>
                    <input class="form-input" type="text" id="destination" name="destination" placeholder="Mumbai, India" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="date">Date</label>
                    <input class="form-input" type="date" id="date" name="date" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="time">Time</label>
                    <input class="form-input" type="time" id="time" name="time" required>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Add Flight</button>
            </div>
        </form>
    </section>
</main>

<footer class="footer">
</footer>

</body>
</html>
