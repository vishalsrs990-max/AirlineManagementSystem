<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Flight {{ flight.flightID }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="page">
<header class="top-bar">
    <div class="top-bar-left">
        <div class="logo-circle">AMS</div>
        <div class="brand-text">
            <span class="brand-name">Airline Management System</span>
            <span class="brand-subtitle">Flight information &amp; management</span>
        </div>
    </div>
</header>

<main class="form-page">
    <section class="form-card">
        <h1>Book flight {{ flight.flightID }}</h1>
        <p>{{ flight.origin }} → {{ flight.destination }} on {{ flight.date }} at {{ flight.time }}</p>

        <form method="post">
            <h3>Passenger details</h3>

            <div class="form-group">
                <label for="full_name" class="form-label">Full name</label>
                <input
                        id="full_name"
                        class="form-input"
                        type="text"
                        name="full_name"
                        required
                >
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input
                        id="email"
                        class="form-input"
                        type="email"
                        name="email"
                        required
                >
            </div>

            <div class="form-group">
                <label for="phone" class="form-label">Phone</label>
                <input
                        id="phone"
                        class="form-input"
                        type="text"
                        name="phone"
                        required
                >
            </div>

            <div class="form-group">
                <label for="num_passengers" class="form-label">Number of passengers</label>
                <input
                        id="num_passengers"
                        class="form-input"
                        type="number"
                        name="num_passengers"
                        min="1"
                        value="1"
                        required
                >
            </div>

            <div class="form-group">
                <label for="cabin_class" class="form-label">Class</label>
                <select
                        id="cabin_class"
                        class="form-input"
                        name="cabin_class"
                        required
                >
                    <option value="Economy">Economy</option>
                    <option value="Premium">Premium Economy</option>
                    <option value="Business">Business</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Confirm booking</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
