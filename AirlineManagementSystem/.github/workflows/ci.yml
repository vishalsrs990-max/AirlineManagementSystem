name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (CI)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # If you have tests, enable this
      # - name: Run tests
      #   run: |
      #     pytest

      - name: Prepare SSH key for EC2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ams-devops-key.pem
          chmod 600 ~/.ssh/ams-devops-key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/ams-devops-key.pem ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            # Go to project folder (same one we used manually)
            cd ~/AirlineManagementSystem

            # If repo not cloned yet, clone it once
            if [ ! -d ".git" ]; then
              cd ~
              rm -rf AirlineManagementSystem
              git clone https://github.com/vishalsrs990-max/AirlineManagementSystem.git
              cd AirlineManagementSystem
            fi

            # Pull latest code
            git pull

            # Create / activate venv
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate

            # Install dependencies
            if [ -f requirements.txt ]; then
              pip install --upgrade pip
              pip install -r requirements.txt
            fi

            # Stop existing app if running
            pkill -f "python app.py" || true

            # Start app in background
            nohup python app.py > app.log 2>&1 &

          EOF
