<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Booking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="page">
<header class="top-bar">
    <div class="top-bar-left">
        <div class="logo-circle">AMS</div>
        <div class="brand-text">
            <span class="brand-name">Airline Management System</span>
            <span class="brand-subtitle">Flight information &amp; management</span>
        </div>
    </div>
</header>

<main class="form-page">
    <section class="form-card">
        <h1>Edit booking</h1>

        <form method="post">
            <div class="form-group">
                <label>Travel date</label>
                <input class="form-input" type="date" name="travel_date"
                       value="{{ booking.travel_date }}" required>
            </div>

            <div class="form-group">
                <label>Number of passengers</label>
                <input class="form-input" type="number" name="num_passengers"
                       min="1" value="{{ booking.num_passengers }}" required>
            </div>

            <div class="form-group">
                <label>Class</label>
                <select class="form-input" name="cabin_class" required>
                    <option value="Economy"  {% if booking.cabin_class=='Economy' %}selected{% endif %}>Economy</option>
                    <option value="Premium"  {% if booking.cabin_class=='Premium' %}selected{% endif %}>Premium Economy</option>
                    <option value="Business" {% if booking.cabin_class=='Business' %}selected{% endif %}>Business</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Update booking</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
